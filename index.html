      "license": "https://creativecommons.org/licenses/by/4.0/",

        "@type": "Organization",
        "name": "depa — Digital Economy Promotion Agency",
        "url": "https://www.depa.or.th"
      },
      "publisher": {
        "@type": "Organization",
        "name": "depa — Digital Economy Promotion Agency"
      },
      "datePublished": "2026-04",
      "dateModified": "2026-06",
      "version": "2026",
      "inLanguage": ["th", "en", "zh"],
      "spatialCoverage": {
        "@type": "Place",
        "name": "Thailand",
        "geo": { "@type": "GeoShape", "polygon": "5.5 97.5 20.5 97.5 20.5 105.7 5.5 105.7 5.5 97.5" }
      },
      "variableMeasured": [
        { "@type": "PropertyValue", "name": "Livability", "unitText": "score 0–100", "valueReference": "weight 25%" },
        { "@type": "PropertyValue", "name": "Economy",    "unitText": "score 0–100", "valueReference": "weight 20%" },
        { "@type": "PropertyValue", "name": "Safety",     "unitText": "score 0–100", "valueReference": "weight 15%" },
        { "@type": "PropertyValue", "name": "Wellbeing",  "unitText": "score 0–100", "valueReference": "weight 15%" },
        { "@type": "PropertyValue", "name": "Environment","unitText": "score 0–100", "valueReference": "weight 10%" },
        { "@type": "PropertyValue", "name": "Hospitality","unitText": "score 0–100", "valueReference": "weight 10%" },
        { "@type": "PropertyValue", "name": "Digital",    "unitText": "score 0–100", "valueReference": "weight 5%" }
      ],
      "distribution": [
        {
          "@type": "DataDownload",
          "encodingFormat": "application/json",
          "contentUrl": "https://sciti.nonarkara.org/data/cities.json",
          "description": "All 118 cities with composite scores and pillar breakdowns (JSON)"
        },
        {
          "@type": "DataDownload",
          "encodingFormat": "text/csv",
          "description": "CSV export available via the Rankings page download button"
        }
      ],
      "keywords": ["smart city", "Thailand", "city index", "urban data", "depa", "livability", "investment", "SCITI"]
    }
