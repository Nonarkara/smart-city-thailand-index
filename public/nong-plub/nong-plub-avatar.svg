<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Nong Plub Crayon Avatar">
  <defs>
    <!-- COLOURED PENCIL. The shape is pushed about by a noise field so no
         edge is straight, then a fibrous grain is multiplied into it, so
         the fill reads as pencil laid down in strokes rather than as a
         flat vector fill. This is the miaoshen hand. -->
    <filter id="crayon-avatar" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="7" result="wobble" />
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="shaken" />
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="19" result="fibre" />
      <feColorMatrix in="fibre" type="matrix"
        values="0 0 0 0 0.44  0 0 0 0 0.38  0 0 0 0 0.30  0 0 0 0.16 0" result="fibreTint" />
      <feComposite in="fibreTint" in2="shaken" operator="in" result="fibreOnShape" />
      <feBlend in="shaken" in2="fibreOnShape" mode="multiply" />
    </filter>
    <!-- The sheet the drawing is on. It is not white. -->
    <filter id="paper-crayon-avatar" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="23" result="noise" />
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.56  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 0.05 0" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
    <radialGradient id="blush-avatar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e79a8c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e79a8c" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g filter="url(#crayon-avatar)">
  <!-- the paper -->
    <rect width="120" height="120" fill="#f6f2e8" />
    <rect width="120" height="120" fill="#f6f2e8" filter="url(#paper-crayon-avatar)" />

  <g filter="url(#crayon-avatar)">
    <!-- Crayon stamp background circle -->
    <circle cx="60" cy="60" r="54" fill="#f6f2e8" stroke="#6f5f4e" stroke-width="2.5" />

    <!-- Hair Back -->
    <path d="M 40 45 Q 32 75 38 95 Q 46 102 52 95 Q 48 70 50 50 Z" fill="#5a4a3e" />
    <path d="M 80 45 Q 88 75 82 95 Q 74 102 68 95 Q 72 70 70 50 Z" fill="#5a4a3e" />

    <!-- Purple Cardigan / Collar -->
    <path d="M 42 85 Q 60 92 78 85 L 82 110 L 38 110 Z" fill="#8a6bb0" stroke="#5a4a3e" stroke-width="2" />
    <path d="M 52 85 L 68 85 L 70 110 L 50 110 Z" fill="#fbf8f1" stroke="#5a4a3e" stroke-width="1.5" />

    <!-- Neck -->
    <path d="M 54 70 L 54 86 Q 60 88 66 86 L 66 70 Z" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="1.8" />

    <!-- Head / Face -->
    <path d="M 42 50 Q 38 78 60 84 Q 82 78 78 50 Q 75 32 60 32 Q 45 32 42 50 Z" fill="#f5d7b8" stroke="#5a4a3e" stroke-width="2" />

    <!-- Eyebrows -->
    <path d="M 48 48 Q 53 45 57 48" fill="none" stroke="#5a4a3e" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 63 48 Q 67 45 72 48" fill="none" stroke="#5a4a3e" stroke-width="1.5" stroke-linecap="round" />

    <!-- Manga Eyes with sparkle -->
    <ellipse cx="52" cy="54" rx="3.5" ry="4" fill="#5a4a3e" />
    <circle cx="51" cy="52.5" r="1.2" fill="#fbf8f1" />
    <ellipse cx="68" cy="54" rx="3.5" ry="4" fill="#5a4a3e" />
    <circle cx="67" cy="52.5" r="1.2" fill="#fbf8f1" />

    <!-- Cheeks Blush -->
    <circle cx="47" cy="60" r="5.5" fill="url(#blush-avatar)" />
    <circle cx="73" cy="60" r="5.5" fill="url(#blush-avatar)" />

    <!-- Cute Smile -->
    <path d="M 54 64 Q 60 72 66 64 Q 60 76 54 64 Z" fill="#b8413a" stroke="#5a4a3e" stroke-width="1.5" />
    <path d="M 56 65 Q 60 67 64 65" fill="#fbf8f1" />

    <!-- Hair Bangs -->
    <path d="M 42 42 Q 52 48 60 42 Q 68 48 78 42 Q 74 35 60 35 Q 46 35 42 42 Z" fill="#5a4a3e" />

    <!-- Black Cap with Red Trim & NCREE logo -->
    <path d="M 40 40 Q 42 16 60 15 Q 78 16 80 40 Q 60 36 40 40 Z" fill="#4a4038" stroke="#463a31" stroke-width="2" />
    <circle cx="60" cy="15" r="2.5" fill="#b8413a" />
    <text x="60" y="30" font-family="system-ui, sans-serif" font-size="6" font-weight="900" fill="#f7f2e6" text-anchor="middle" letter-spacing="0.5">NCREE</text>
    <path d="M 36 38 Q 60 32 84 38 Q 86 44 78 45 Q 60 39 38 45 Q 34 43 36 38 Z" fill="#4a4038" stroke="#463a31" stroke-width="1.5" />
    <path d="M 38 44 Q 60 38 80 44" fill="none" stroke="#b8413a" stroke-width="1.8" stroke-linecap="round" />

    <!-- Cute little peace sign ✌️ peeking at side -->
    <g transform="translate(86, 68)">
      <circle cx="8" cy="8" r="6" fill="#f0c9a4" stroke="#6f5f4e" stroke-width="1.5" />
      <line x1="5" y1="5" x2="3" y2="-5" stroke="#5a4a3e" stroke-width="2" stroke-linecap="round" />
      <line x1="9" y1="5" x2="11" y2="-3" stroke="#5a4a3e" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
  </g>
</svg>
