<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" role="img" aria-label="Nong Plub in plaid dress with beaded bracelet at cafe deck with laptop">
  <defs>
    <!-- COLOURED PENCIL. The shape is pushed about by a noise field so no
         edge is straight, then a fibrous grain is multiplied into it, so
         the fill reads as pencil laid down in strokes rather than as a
         flat vector fill. This is the miaoshen hand. -->
    <filter id="crayon-cafe" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="7" result="wobble" />
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="shaken" />
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="19" result="fibre" />
      <feColorMatrix in="fibre" type="matrix"
        values="0 0 0 0 0.44  0 0 0 0 0.38  0 0 0 0 0.30  0 0 0 0.16 0" result="fibreTint" />
      <feComposite in="fibreTint" in2="shaken" operator="in" result="fibreOnShape" />
      <feBlend in="shaken" in2="fibreOnShape" mode="multiply" />
    </filter>
    <!-- The sheet the drawing is on. It is not white. -->
    <filter id="paper-crayon-cafe" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="23" result="noise" />
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.56  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 0.05 0" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
    <radialGradient id="blush-grad-cafe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e79a8c" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#e79a8c" stop-opacity="0" />
    </radialGradient>
    <pattern id="plaid-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#454239" />
      <line x1="0" y1="8" x2="16" y2="8" stroke="#4d4a43" stroke-width="2" />
      <line x1="8" y1="0" x2="8" y2="16" stroke="#4d4a43" stroke-width="2" />
      <line x1="0" y1="4" x2="16" y2="4" stroke="#5b5850" stroke-width="0.8" />
      <line x1="4" y1="0" x2="4" y2="16" stroke="#5b5850" stroke-width="0.8" />
    </pattern>
  </defs>
  <g filter="url(#crayon-cafe)">
  <!-- the paper -->
    <rect width="320" height="400" fill="#f6f2e8" />
    <rect width="320" height="400" fill="#f6f2e8" filter="url(#paper-crayon-cafe)" />

  <g filter="url(#crayon-cafe)">
    <!-- Soft warm matcha-cafe paper background aura -->
    <!-- the place, loosely: a drawn vignette rather than a sticker rim -->
    <circle cx="160" cy="200" r="143" fill="#f6f2e8" opacity="0.42" />
    <circle cx="160" cy="200" r="143" fill="none" stroke="#6f5f4e" stroke-width="1.6" opacity="0.3" stroke-linecap="round" />

    <!-- Outdoor Cafe Foliage / Monstera leaf in background -->
    <g opacity="0.65">
      <path d="M 40 140 Q 60 110 90 120 Q 95 145 75 165 Q 55 160 40 140 Z" fill="#cfe0c4" stroke="#7f9a6e" stroke-width="1.5" />
      <line x1="45" y1="145" x2="85" y2="130" stroke="#7f9a6e" stroke-width="1.5" />
    </g>

    <!-- Wooden Cafe Deck Table (foreground) -->
    <rect x="25" y="305" width="270" height="16" fill="#d3a479" stroke="#8a6238" stroke-width="2" />
    <line x1="30" y1="312" x2="290" y2="312" stroke="#a97f4e" stroke-width="1.2" />
    <!-- Table leg -->
    <rect x="150" y="321" width="20" height="50" fill="#9a7444" stroke="#8a6238" stroke-width="2" />

    <!-- Silver Laptop open on table -->
    <g transform="translate(195, 255)">
      <!-- Laptop Screen -->
      <polygon points="10,0 60,0 55,48 5,48" fill="#e4dece" stroke="#5b5850" stroke-width="1.8" />
      <polygon points="14,4 56,4 52,44 10,44" fill="#0f172a" />
      <!-- Antigravity / Smart City code screen glint -->
      <line x1="16" y1="12" x2="35" y2="12" stroke="#7fa3bd" stroke-width="1.5" />
      <line x1="16" y1="18" x2="45" y2="18" stroke="#9b86b5" stroke-width="1.5" />
      <line x1="16" y1="24" x2="30" y2="24" stroke="#9bb087" stroke-width="1.5" />
      <!-- Laptop Keyboard Base -->
      <polygon points="0,50 65,50 72,56 -5,56" fill="#d8d2c4" stroke="#5b5850" stroke-width="1.8" />
    </g>

    <!-- Glass of Iced Thai Tea on table -->
    <g transform="translate(45, 260)">
      <polygon points="5,15 25,15 22,48 8,48" fill="#e8c9a4" stroke="#c9662f" stroke-width="1.5" />
      <line x1="7" y1="22" x2="23" y2="22" stroke="#fbf8f1" stroke-width="1" />
      <!-- Straw -->
      <line x1="15" y1="6" x2="22" y2="45" stroke="#b8413a" stroke-width="2" stroke-linecap="round" />
      <!-- Ice cubes -->
      <rect x="10" y="24" width="6" height="6" fill="#fbf8f1" opacity="0.6" />
    </g>

    <!-- Hair Back (Shoulder length dark hair) -->
    <path d="M 115 145 Q 102 205 110 260 Q 124 275 138 260 Q 130 205 135 155 Z" fill="#5a4a3e" />
    <path d="M 205 145 Q 218 205 210 260 Q 196 275 182 260 Q 190 205 185 155 Z" fill="#5a4a3e" />

    <!-- Torso: Dark Plaid Sleeveless Summer Dress -->
    <path d="M 134 205 Q 160 212 186 205 L 194 315 L 126 315 Z" fill="url(#plaid-pattern)" stroke="#5a4a3e" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Sleeveless scoop neckline -->
    <path d="M 144 202 Q 160 218 176 202" fill="none" stroke="#5a4a3e" stroke-width="2" />

    <!-- Left Arm & Hand with Peace Sign ✌️ (Viewer's left) -->
    <!-- Arm raised -->
    <path d="M 134 205 Q 110 210 100 170 Q 110 162 122 178 Q 128 195 138 212 Z" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="2.2" />
    <path d="M 104 172 L 90 135 Q 98 132 108 142 L 120 180 Z" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="2" />

    <!-- Colorful Beaded Bracelets on Left Wrist (Turquoise, Red, Yellow beads from photo!) -->
    <g transform="translate(94, 148)">
      <circle cx="0" cy="0" r="2.5" fill="#6b8ca8" stroke="#6f5f4e" stroke-width="0.8" />
      <circle cx="5" cy="1" r="2.5" fill="#c4524a" stroke="#6f5f4e" stroke-width="0.8" />
      <circle cx="10" cy="0" r="2.5" fill="#c08a2e" stroke="#6f5f4e" stroke-width="0.8" />
      <circle cx="15" cy="-2" r="2.5" fill="#6f9070" stroke="#6f5f4e" stroke-width="0.8" />
    </g>

    <!-- Peace Sign Hand ✌️ -->
    <circle cx="88" cy="128" r="9" fill="#f0c9a4" stroke="#6f5f4e" stroke-width="2" />
    <!-- Index finger -->
    <path d="M 85 122 L 78 98 Q 83 95 86 98 L 90 120" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="2" stroke-linecap="round" />
    <!-- Middle finger -->
    <path d="M 90 120 L 96 100 Q 100 102 98 106 L 94 124" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="2" stroke-linecap="round" />

    <!-- Right Arm (resting near laptop, viewer's right) -->
    <path d="M 186 205 Q 205 230 208 275 Q 198 285 188 280 Q 186 250 178 220 Z" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="2.2" />
    <!-- Black Smartwatch on Right Wrist -->
    <rect x="198" y="270" width="8" height="12" rx="2" fill="#0f172a" stroke="#4d4a43" stroke-width="1" />
    <circle cx="202" cy="285" r="7" fill="#f0c9a4" stroke="#6f5f4e" stroke-width="2" />

    <!-- Neck -->
    <path d="M 152 180 L 152 205 Q 160 210 168 205 L 168 180 Z" fill="#f0c9a4" stroke="#5a4a3e" stroke-width="2" />

    <!-- Head / Face -->
    <path d="M 126 138 Q 120 180 160 190 Q 200 180 194 138 Q 190 102 160 102 Q 130 102 126 138 Z" fill="#f5d7b8" stroke="#5a4a3e" stroke-width="2.5" />

    <!-- Hair Bangs / Gentle natural part -->
    <path d="M 124 126 Q 140 108 160 108 Q 185 108 196 126 Q 184 118 170 126 Q 155 118 138 130 Q 128 126 124 126 Z" fill="#5a4a3e" />
    <path d="M 126 132 Q 130 152 134 168" fill="none" stroke="#5a4a3e" stroke-width="2" />
    <path d="M 194 132 Q 190 152 186 168" fill="none" stroke="#5a4a3e" stroke-width="2" />

    <!-- Eyebrows -->
    <path d="M 138 138 Q 146 133 152 137" fill="none" stroke="#5a4a3e" stroke-width="2" stroke-linecap="round" />
    <path d="M 168 137 Q 174 133 182 138" fill="none" stroke="#5a4a3e" stroke-width="2" stroke-linecap="round" />

    <!-- Cheerful Manga Eyes with sparkle -->
    <ellipse cx="145" cy="147" rx="4.5" ry="5.5" fill="#5a4a3e" />
    <circle cx="143.5" cy="145" r="1.6" fill="#fbf8f1" />
    <ellipse cx="175" cy="147" rx="4.5" ry="5.5" fill="#5a4a3e" />
    <circle cx="173.5" cy="145" r="1.6" fill="#fbf8f1" />

    <!-- Sweet Pink Cheeks -->
    <circle cx="136" cy="156" r="9" fill="url(#blush-grad-cafe)" />
    <circle cx="184" cy="156" r="9" fill="url(#blush-grad-cafe)" />

    <!-- Nose -->
    <circle cx="160" cy="152" r="1.5" fill="#e0b287" />

    <!-- Happy Open Smile -->
    <path d="M 148 162 Q 160 174 172 162 Q 160 180 148 162 Z" fill="#b8413a" stroke="#5a4a3e" stroke-width="2" stroke-linejoin="round" />
    <path d="M 152 164 Q 160 167 168 164" fill="#fbf8f1" />

    <!-- Sparkle note -->
    <path d="M 265 110 Q 272 105 278 112 Q 285 106 288 115" stroke="#c89434" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
  </g>
</svg>
